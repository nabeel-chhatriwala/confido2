[project]
name = "pipecat-worker"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "websockets>=13",
  "pipecat-ai[deepgram,openai,elevenlabs,silero]>=0.0.50",
  "supabase>=2.9",
  "httpx>=0.27",
  "pydantic>=2.9",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
